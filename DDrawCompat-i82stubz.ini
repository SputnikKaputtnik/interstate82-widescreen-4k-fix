; Interstate '82 (GOG) — proven compatibility settings, release profile
; Keep the single fixed CPU core: it prevents the i82sim.dll mission/level crash.
FullscreenMode = borderless
DisplayResolution = desktop
; The shim widens the game's own mode filter to offer 1920x1080 and 3840x2160. DDrawCompat's
; default (native) already includes them if the display reports them; listing them here keeps
; them available on displays that do not.
SupportedResolutions = native, 640x480, 800x600, 1024x768, 1920x1080, 3840x2160
DisplayAspectRatio = app
DisplayRefreshRate = desktop
CpuAffinity = 1
CpuAffinityRotation = off
LogLevel = none
CrashDump = off
; The game does not appear to need GDI interop. Without this, DDrawCompat presents from a copy
; of the whole virtual desktop whenever the primary surface is lost (mission exit,
; restart, Alt+Tab). On large or multi-monitor desktops that allocation can fail in
; the 32-bit game and crash it (narzoul/DDrawCompat#625).
GdiInterops = none
