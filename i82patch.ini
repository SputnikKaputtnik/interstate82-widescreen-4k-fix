; Interstate '82 widescreen & 4K fix - optional settings
; https://github.com/SputnikKaputtnik/interstate82-widescreen-4k-fix

[Display]
; Field of view on 16:9 (and other formats wider than 4:3).
;   0 = original: the game keeps its 90-degree horizontal view, so 16:9
;       shows less at the top and bottom than 4:3 (default)
;   1 = Hor+: the same height as 4:3, plus more to the sides
; Hor+ puts about a third more of the world in view. If the player's car
; is missing at the start of a level, set this back to 0.
HorPlus=0
